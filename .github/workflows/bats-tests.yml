name: BATS Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-file:
          - test/api_contract_test.bats
          - test/cli_rename_test.bats
          - test/config_test.bats
          - test/first_test.bats
          - test/fzf_dims_test.bats
          - test/integration_test.bats
          - test/new_commands_test.bats
          - test/npm_test.bats
          - test/out_test.bats
          - test/parse_bash_test.bats
          - test/smoke_test.bats
          - test/test.bats
          - test/ts_test.bats

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Bash
        run: bash --version

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jc

      - name: Install BATS
        run: sudo ./test/bats/install.sh /usr/local

      - name: Run ${{ matrix.test-file }}
        # Problem: https://github.com/actions/runner/issues/241
        # Solution: https://github.com/gfx/example-github-actions-with-tty?tab=readme-ov-file
        shell: 'script -q -e -c "bash {0}" /dev/null'
        env:
          TERM: xterm-256color
        run: |
          source ./activate -t
          bats --jobs "$(nproc)" "${{ matrix.test-file }}"
